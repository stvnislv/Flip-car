<script>
// VK Games: VK Bridge init + interstitial and rewarded ads, exposed through the same
// window.ya interface the game polls (ya = "ads layer").
window.ya = { sdk: null, adOpen: false, rewardResult: '' };
(function () {
  var b = window.vkBridge;
  if (!b) return;
  b.send('VKWebAppInit').then(function () { window.ya.sdk = b; }).catch(function () {});
})();
window.yaGameReady = function () {};
window.yaFullscreen = function () {
  var b = window.ya.sdk;
  if (!b || window.ya.adOpen) return;
  b.send('VKWebAppCheckNativeAds', { ad_format: 'interstitial' }).then(function (d) {
    if (!d || !d.result) return;
    window.ya.adOpen = true;
    return b.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' });
  }).catch(function () {}).then(function () { window.ya.adOpen = false; });
};
window.yaRewarded = function () {
  var b = window.ya.sdk;
  if (!b) { window.ya.rewardResult = 'fail'; return; }
  window.ya.rewardResult = 'pending';
  window.ya.adOpen = true;
  b.send('VKWebAppShowNativeAds', { ad_format: 'reward' }).then(function (d) {
    window.ya.rewardResult = (d && d.result) ? 'ok' : 'closed';
  }).catch(function () { window.ya.rewardResult = 'fail'; }).then(function () { window.ya.adOpen = false; });
};
</script>

<script>
window.fcNameResult = '';
window.fcAskName = function (cur) {
  var d = document.getElementById('fcName'), i = document.getElementById('fcNameIn');
  i.value = cur || ''; d.style.display = 'flex';
};
(function () {
  var i = document.getElementById('fcNameIn');
  function done() {
    var v = i.value.trim(); if (!v) { i.focus(); return; }
    window.fcNameResult = v; i.blur();
    document.getElementById('fcName').style.display = 'none';
  }
  document.getElementById('fcNameOk').addEventListener('click', done);
  i.addEventListener('keydown', function (e) { if (e.key === 'Enter') done(); });
  ['touchstart', 'touchend', 'mousedown', 'pointerdown', 'keydown', 'keyup'].forEach(function (ev) {
    document.getElementById('fcName').addEventListener(ev, function (e) { e.stopPropagation(); });
  });
})();

		<script>
(function(){
  // The engine is stored in two parts (host file-size limit); glue them back together on load.
  var origFetch = window.fetch.bind(window);
  var cache = null;
  function engineResponse(){
    if(!cache){
      cache = Promise.all([origFetch('../engine_a.wasm'), origFetch('../engine_b.wasm')])
        .then(function(rs){ return Promise.all(rs.map(function(r){ if(!r.ok) throw new Error('engine part '+r.status); return r.arrayBuffer(); })); })
        .then(function(bufs){ return new Blob(bufs, {type:'application/wasm'}); });
    }
    return cache.then(function(b){ return new Response(b, {status:200, headers:{'Content-Type':'application/wasm','Content-Length': String(b.size)}}); });
  }
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input && input.url) || '';
    var base = url.split('?')[0].split('/').pop();
    if (base === 'index.wasm') return engineResponse();
    if (base === 'index.pck') return origFetch('../game_data29.wasm', init);
    return origFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4609712,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":""};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
